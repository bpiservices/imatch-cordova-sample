<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>iMatch Sample</title>
</head>
<body>
    <header>
        <img src="img/logo.svg" alt="" class="logo">
        <div>
            <h1>iMatch Sample</h1>
            <div id="deviceStatus" class="muted">Not connected</div>
        </div>
    </header>

    <section id="deviceInfo" class="bar" hidden>
        <span id="hardware"></span>
        <span id="firmware"></span>
        <span id="battery"></span>
    </section>

    <section class="actions">
        <button id="connectButton">Connect</button>
        <button id="disconnectButton" disabled>Disconnect</button>
        <button id="fingerButton" disabled>Fingerprint</button>
        <button id="smartcardButton" disabled>Smartcard</button>
        <button id="nfcButton" disabled>Passport</button>
        <button id="updateButton" disabled>Update</button>
        <button id="cancelUpdateButton" class="danger" hidden>Cancel update</button>
        <button id="clearButton" class="secondary">Clear log</button>
    </section>

    <section id="devices" class="devices" hidden></section>

    <section class="field">
        <label for="mrzInput">MRZ (two or three lines as printed on the document)</label>
        <textarea id="mrzInput" rows="3" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <div id="mrzHint" class="muted"></div>
    </section>

    <section id="progress" class="progress" hidden>
        <div id="progressLabel"></div>
        <div class="track"><div id="progressBar" class="fill"></div></div>
    </section>

    <section id="log" class="log" aria-live="polite"></section>

    <script src="cordova.js"></script>
    <script src="js/mrz.js"></script>
    <script src="js/imatch-events.js"></script>
    <script src="js/app.js"></script>
    <script>app.initialize();</script>
</body>
</html>
